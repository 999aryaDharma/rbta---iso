name: CI Verification & Production Gates

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: 1. Python Quality & Research Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Repository Hygiene & Git Diff Check
        run: |
          git diff --check

      - name: Pytest Collection Check
        run: |
          python -m pytest --collect-only -q

      - name: Full Python Test Suite Regression
        run: |
          python -m pytest -v

  frontend:
    name: 2. Dashboard Quality, ESLint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        working-directory: dashboard
        run: |
          npm ci

      - name: ESLint Verification
        working-directory: dashboard
        run: |
          npm run lint

      - name: TypeScript Typecheck
        working-directory: dashboard
        run: |
          npm run typecheck

      - name: Unit Tests (Vitest)
        working-directory: dashboard
        run: |
          npm run test

      - name: Production SPA Build
        working-directory: dashboard
        run: |
          npm run build

      - name: Audit Production Dependencies
        working-directory: dashboard
        run: |
          npm audit --omit=dev --audit-level=high

      - name: Offline Asset & Secret Sentinel Scan
        working-directory: dashboard
        run: |
          if grep -Eq 'https?://' dist/index.html; then
            echo "Security Error: dist/index.html contains external remote URLs/CDNs!"
            exit 1
          fi
          echo "Verified: dist/index.html references zero external CDNs."

  frontend-e2e:
    name: 3. Dashboard Real Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        working-directory: dashboard
        run: |
          npm ci

      - name: Install Playwright Chromium & System Dependencies
        working-directory: dashboard
        run: |
          npx playwright install --with-deps chromium

      - name: Build Dashboard for Preview
        working-directory: dashboard
        run: |
          npm run build

      - name: Run Playwright E2E Test Suite
        working-directory: dashboard
        run: |
          npm run test:e2e

  docker:
    name: 4. Production Docker Build & Smoke
    runs-on: ubuntu-latest
    needs: [test, frontend, frontend-e2e]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate ASUS Docker Compose Specification
        run: |
          RBTA_API_KEY=ci-dummy-token RBTA_MODEL_VERSION=ci-smoke-v1 docker compose -f deploy/asus/compose.yml config --quiet
          echo "Docker Compose specification parsed successfully with required variables."

      - name: Build Production Image with Provenance
        run: |
          docker build --no-cache \
            --build-arg GIT_SHA="${{ github.sha }}" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t rbta-service:ci .

      - name: Verify Container Fail-Closed on Missing RBTA_API_KEY
        run: |
          EXIT_CODE=0
          docker run --rm -e RBTA_MODEL_VERSION=ci-smoke-v1 rbta-service:ci || EXIT_CODE=$?
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "Security Error: Container started without mandatory RBTA_API_KEY!"
            exit 1
          fi
          echo "Verified: Container correctly failed closed when RBTA_API_KEY is missing."

      - name: Start Production Container Smoke Instance
        run: |
          docker run -d --name rbta-smoke -p 8000:8000 \
            -e RBTA_API_KEY=ci-smoke-key-123 \
            -e RBTA_MODEL_VERSION=ci-smoke-v1 \
            -e RBTA_LOG_LEVEL=DEBUG \
            rbta-service:ci

      - name: Verify Non-Root User Execution
        run: |
          UID_VAL=$(docker exec rbta-smoke id -u)
          echo "Container runtime UID: $UID_VAL"
          if [ "$UID_VAL" -eq 0 ]; then
            echo "Security Error: Container is running as root (UID 0)!"
            exit 1
          fi

      - name: Verify Fail-Closed Liveness Probe (/health)
        run: |
          HEALTH_OK=false
          for i in {1..30}; do
            if docker exec rbta-smoke python -c "import urllib.request; res = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); assert res.status == 200" 2>/dev/null; then
              echo "Liveness check passed on attempt $i."
              HEALTH_OK=true
              break
            fi
            echo "Waiting for server startup... ($i/30)"
            sleep 1
          done
          if [ "$HEALTH_OK" != "true" ]; then
            echo "Fatal Error: Liveness check failed after 30 attempts!"
            docker logs rbta-smoke
            exit 1
          fi

      - name: Verify Root Redirect & Dashboard Index (/dashboard/)
        run: |
          docker exec rbta-smoke python -c "import urllib.request; res = urllib.request.urlopen('http://127.0.0.1:8000/dashboard/', timeout=2); body = res.read().decode('utf-8'); assert res.status == 200 and 'id=\"root\"' in body"
          echo "Dashboard index.html served successfully."

      - name: Verify Static JS/CSS Asset Serving
        run: |
          docker exec rbta-smoke python -c "
          import urllib.request, os, glob
          assets = glob.glob('/app/dashboard/dist/assets/index-*.js')
          assert assets, 'No JS bundle found in dist/assets'
          js_name = os.path.basename(assets[0])
          url = f'http://127.0.0.1:8000/dashboard/assets/{js_name}'
          res = urllib.request.urlopen(url, timeout=2)
          assert res.status == 200, f'Expected 200 got {res.status}'
          print(f'Asset {js_name} served successfully with 200.')
          "

      - name: Verify Nested SPA Route Serving
        run: |
          docker exec rbta-smoke python -c "
          import urllib.request
          res = urllib.request.urlopen('http://127.0.0.1:8000/dashboard/meta-alerts/101/raw-alerts/wazuh-alt-001', timeout=2)
          assert res.status == 200
          body = res.read().decode('utf-8')
          assert 'id=\"root\"' in body, 'SPA fallback must serve index.html with root div'
          print('Nested SPA client route served successfully with 200 fallback.')
          "

      - name: Verify API Authentication & 404 Isolation
        run: |
          docker exec rbta-smoke python -c "
          import urllib.request, urllib.error
          # 1. Missing auth returns 401
          try:
              urllib.request.urlopen('http://127.0.0.1:8000/api/v1/auth/check', timeout=2)
              raise AssertionError('Expected 401 Unauthorized for missing token')
          except urllib.error.HTTPError as e:
              assert e.code == 401, f'Expected 401 got {e.code}'

          # 2. Valid token returns 200
          req = urllib.request.Request('http://127.0.0.1:8000/api/v1/auth/check', headers={'Authorization': 'Bearer ci-smoke-key-123'})
          res = urllib.request.urlopen(req, timeout=2)
          assert res.status == 200

          # 3. Missing API route returns JSON 404 (does NOT fallback to HTML)
          try:
              urllib.request.urlopen('http://127.0.0.1:8000/api/v1/nonexistent-route', timeout=2)
              raise AssertionError('Expected 404 for missing API endpoint')
          except urllib.error.HTTPError as e:
              assert e.code == 404
              assert 'application/json' in e.headers.get('Content-Type', '')
          print('API authentication and JSON 404 behavior verified.')
          "

      - name: Stop and Cleanup Container
        if: always()
        run: |
          docker stop rbta-smoke || true
          docker rm rbta-smoke || true
