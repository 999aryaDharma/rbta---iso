name: CI Verification & Docker Smoke

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: Unit & Integration Tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Repository Hygiene & Git Diff Check
        run: |
          git diff --check

      - name: Pytest Collection Check
        run: |
          python -m pytest --collect-only -q

      - name: Full Test Suite Regression
        run: |
          python -m pytest -v

  frontend:
    name: Frontend Build & Typecheck (Node.js 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        working-directory: dashboard
        run: |
          npm ci || npm install

      - name: Dashboard TypeScript & Lint Verification
        working-directory: dashboard
        run: |
          npm run lint
          npm run typecheck

      - name: Dashboard Unit Tests (Vitest)
        working-directory: dashboard
        run: |
          npm run test

      - name: Dashboard Production Build
        working-directory: dashboard
        run: |
          npm run build

  docker:
    name: Production Docker Build & Container Smoke
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate ASUS Docker Compose Specification
        run: |
          RBTA_API_KEY=ci-dummy-token RBTA_MODEL_VERSION=ci-smoke-v1 docker compose -f deploy/asus/compose.yml config --quiet
          echo "Docker Compose specification parsed successfully with required variables."

      - name: Build Production Image with Provenance
        run: |
          docker build --no-cache \
            --build-arg GIT_SHA="${{ github.sha }}" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t rbta-service:ci .

      - name: Start Container Smoke Instance
        run: |
          docker run -d --name rbta-smoke -p 8000:8000 -e RBTA_LOG_LEVEL=DEBUG rbta-service:ci

      - name: Verify Non-Root User Execution
        run: |
          UID_VAL=$(docker exec rbta-smoke id -u)
          echo "Container runtime UID: $UID_VAL"
          if [ "$UID_VAL" -eq 0 ]; then
            echo "Security Error: Container is running as root (UID 0)!"
            exit 1
          fi

      - name: Verify Liveness Probe (/health)
        run: |
          for i in {1..30}; do
            if docker exec rbta-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)" 2>/dev/null; then
              echo "Liveness check passed successfully on attempt $i."
              break
            fi
            echo "Waiting for server startup... ($i/30)"
            sleep 1
          done

      - name: Verify Dashboard Serving Probe (/dashboard/)
        run: |
          for i in {1..10}; do
            if docker exec rbta-smoke python -c "import urllib.request; res = urllib.request.urlopen('http://127.0.0.1:8000/dashboard/', timeout=2); assert res.status == 200" 2>/dev/null; then
              echo "Dashboard static serving passed successfully on attempt $i."
              exit 0
            fi
            echo "Waiting for dashboard route... ($i/10)"
            sleep 1
          done
          echo "Error: Server failed to serve /dashboard/ with 200"
          docker logs rbta-smoke
          exit 1

      - name: Stop and Cleanup Container
        if: always()
        run: |
          docker stop rbta-smoke || true
          docker rm rbta-smoke || true
