name: rbta-local

services:
  rbta-service:
    container_name: rbta-local-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${RBTA_CODE_SHA:-local-development}
        BUILD_DATE: ${RBTA_BUILD_DATE:-local}
    image: rbta-service:${RBTA_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001
    ports:
      - "127.0.0.1:${RBTA_HOST_PORT:?RBTA_HOST_PORT is required}:8000"
    environment:
      RBTA_API_KEY: ${RBTA_API_KEY:?RBTA_API_KEY is required}
      RBTA_MODEL_VERSION: ${RBTA_MODEL_VERSION:?RBTA_MODEL_VERSION is required}
      RBTA_SOURCE_MODE: ${RBTA_SOURCE_MODE:-DEFERRED}
      RBTA_MODEL_REGISTRY_DIR: /app/artifacts/models
      RBTA_STATE_FILE: /app/data/runtime/state.json
      RBTA_RAW_EVIDENCE_DB: /app/data/runtime/raw_alert_evidence.sqlite3
      RBTA_REPLAY_DATA_DIR: /app/data/replay
      RBTA_REPLAY_RUNS_DIR: /app/data/runtime/replay-runs
      RBTA_HOST: 0.0.0.0
      RBTA_PORT: "8000"
      RBTA_LOG_LEVEL: ${RBTA_LOG_LEVEL:-INFO}
    volumes:
      - type: volume
        source: rbta-local-state
        target: /app/data/runtime
      - type: bind
        source: ${RBTA_MODEL_HOST_DIR:?RBTA_MODEL_HOST_DIR is required}
        target: /app/artifacts/models
        read_only: true
      - type: bind
        source: ${RBTA_REPLAY_HOST_DIR:?RBTA_REPLAY_HOST_DIR is required}
        target: /app/data/replay
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: ${RBTA_CPU_LIMIT:-4.00}
          memory: ${RBTA_MEMORY_LIMIT:-4096M}
          pids: ${RBTA_PIDS_LIMIT:-200}

volumes:
  rbta-local-state:
    name: rbta-local-state
