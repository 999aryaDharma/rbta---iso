services:
  rbta-service:
    container_name: rbta-service
    build:
      context: ../..
      dockerfile: Dockerfile
    image: rbta-service:s10
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: false
    ports:
      - "127.0.0.1:${RBTA_HOST_PORT:-8000}:8000"
    environment:
      # Mandatory Fail-Closed Production Configuration
      - RBTA_API_KEY=${RBTA_API_KEY:?RBTA_API_KEY is required for production deployment}
      - RBTA_MODEL_VERSION=${RBTA_MODEL_VERSION:?RBTA_MODEL_VERSION is required for production deployment}
      - RBTA_MODEL_REGISTRY_DIR=/app/artifacts/models
      - RBTA_STATE_FILE=/app/data/runtime/state.json
      - RBTA_HOST=0.0.0.0
      - RBTA_PORT=8000
      - RBTA_LOG_LEVEL=${RBTA_LOG_LEVEL:-INFO}
    volumes:
      # Host-mounted durable runtime state (RW)
      - ./state:/app/data/runtime:rw
      # Host-mounted immutable model registry (RO)
      - ./models:/app/artifacts/models:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${RBTA_CPU_LIMIT:-2.00}"
          memory: "${RBTA_MEMORY_LIMIT:-1024M}"
          pids: ${RBTA_PIDS_LIMIT:-100}
        reservations:
          cpus: "${RBTA_CPU_RESERVATION:-0.25}"
          memory: "${RBTA_MEMORY_RESERVATION:-256M}"
